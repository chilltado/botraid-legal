<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BotRaid — Legal</title>
<meta name="robots" content="index, follow">
<link rel="icon" href="/favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0d13; --panel:#151a25; --line:#2b3446; --line2:#3d4a61;
    --ink:#e9eef7; --dim:#93a1b8; --faint:#6a7688; --teal:#3ad9d2; --shadow:#04060a;
  }
  *{box-sizing:border-box}
  body{
    margin:0;padding:0 0 72px;color:var(--ink);background:var(--bg);
    font:15px/1.8 "IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    -webkit-text-size-adjust:100%;
    background-image:linear-gradient(#ffffff05 1px,transparent 1px),linear-gradient(90deg,#ffffff05 1px,transparent 1px);
    background-size:32px 32px;
  }
  .bar{position:sticky;top:0;z-index:10;background:#0b0d13f2;border-bottom:2px solid var(--line)}
  .bar div{max-width:52rem;margin:0 auto;padding:0 1.25rem;height:62px;display:flex;align-items:center;gap:11px}
  .bar a{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink);font-family:"Press Start 2P",monospace;font-size:11px}
  .bar img{width:28px;height:28px;image-rendering:pixelated}
  .bar .sp{margin-left:auto;font-family:"Press Start 2P",monospace;font-size:9px;color:var(--faint)}
  main{max-width:52rem;margin:0 auto;padding:2.6rem 1.25rem 0}
  h1,h2,h3{font-family:"Press Start 2P",monospace;font-weight:400;letter-spacing:0;line-height:1.55}
  h1{font-size:clamp(15px,3vw,22px);margin:0 0 1.4rem}
  h2{font-size:13px;margin:2.8rem 0 .9rem;color:var(--teal)}
  h3{font-size:11px;margin:2rem 0 .7rem;color:var(--dim)}
  p,ul,ol{margin:0 0 1.1rem}
  ul,ol{padding-left:1.3rem}
  li{margin-bottom:.5rem}
  strong{color:#fff}
  a{color:var(--teal)}
  a:hover{color:#fff}
  hr{border:0;border-top:2px solid var(--line);margin:2.4rem 0}
  blockquote{margin:0 0 1.1rem;padding:.9rem 1.1rem;border:2px solid var(--line);border-left:6px solid var(--teal);background:#ffffff06;color:var(--dim)}
  code{font-family:inherit;background:#ffffff0d;border:1px solid var(--line);padding:.1rem .35rem}
  table{width:100%;border-collapse:collapse;margin:0 0 1.3rem;font-size:13.5px}
  th,td{border:2px solid var(--line);padding:.6rem .7rem;text-align:left;vertical-align:top}
  th{background:var(--panel);font-weight:600;color:var(--ink)}
  footer{max-width:52rem;margin:3.4rem auto 0;padding:1.6rem 1.25rem 0;border-top:2px solid var(--line);color:var(--faint);font-size:12.5px}
  footer a{color:var(--faint);text-decoration:none}
  footer a:hover{color:var(--teal)}
</style>
</head>
<body>
<div class="bar"><div>
  <a href="https://chilltado.github.io/"><img src="/assets/chilltado-mark.png" alt="">CHILLTADO</a>
  <span class="sp">BOTRAID · LEGAL</span>
</div></div>
<main>
<h1>BotRaid: Idle Strategy TD</h1>
<p>Legal documents for the mobile game <strong>BotRaid</strong>, developed by chilltado.</p>
<ul><li><a href="privacy-policy">Privacy Policy</a></li><li><a href="terms-of-service">Terms of Service</a></li></ul>
<p>Contact: chilltadolab@gmail.com</p>
</main>
<footer><a href="/botraid-legal/">All BotRaid legal documents</a></footer>
</body>
</html>
